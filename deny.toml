[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "NCSA",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "libc", reason = "reaches outside the process; only the platform crate may (Constitution §9)", wrappers = ["debar-platform", "nix", "rustix", "linux-raw-sys", "errno", "memmap2", "getrandom", "rand", "rand_core", "fastrand", "socket2", "mio", "tokio", "io-uring", "polling", "signal-hook", "tempfile"] },
