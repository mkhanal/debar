[package]
name = "debar-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
cap = { version = "=0.1.2", default-features = false }
debar-clamav-signatures = { path = "../crates/clamav-signatures" }
debar-formats = { path = "../crates/formats" }
debar-image = { path = "../crates/image" }
debar-matching = { path = "../crates/matching" }
debar-platform = { path = "../crates/platform" }
debar-scan = { path = "../crates/scan" }
libfuzzer-sys = "=0.4.13"
md-5 = { version = "=0.11.0", default-features = false }

[workspace]
members = ["."]

[[bin]]
name = "database_files"
path = "../crates/clamav-signatures/fuzz_targets/database_files.rs"
test = false
doc = false
bench = false

