[workspace]
resolver = "3"
members = [
    "acceptance",
    "crates/clamav-signatures",
    "crates/compiler",
    "crates/formats",
    "crates/image",
    "crates/interfaces",
    "crates/matching",
    "crates/platform",
    "crates/scan",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
cap = { version = "=0.1.2", default-features = false, features = ["stats"] }
cms = { version = "=0.2.3", default-features = false, features = ["alloc"] }
const-oid = { version = "=0.9.6", default-features = false, features = ["db"] }
der = { version = "=0.7.10", default-features = false, features = ["alloc", "oid"] }
debar-clamav-signatures = { path = "crates/clamav-signatures" }
debar-formats = { path = "crates/formats" }
debar-image = { path = "crates/image" }
debar-matching = { path = "crates/matching" }
debar-platform = { path = "crates/platform" }
debar-scan = { path = "crates/scan" }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
libc = { version = "=0.2.191", default-features = false }
md-5 = { version = "=0.11.0", default-features = false }
memmap2 = "=0.9.12"
num-bigint = { version = "=0.4.8", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "nfa-thompson", "nfa-pikevm", "nfa-backtrack", "hybrid", "meta", "perf-inline", "perf-literal"] }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
x509-cert = { version = "=0.2.5", default-features = false }
zerocopy = { version = "=0.8.63", features = ["derive"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
string_slice = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
disallowed_methods = "forbid"
disallowed_types = "forbid"
