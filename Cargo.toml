[workspace]
resolver = "3"
members = ["crates/platform", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde_json = "=1.0.154"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
string_slice = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "forbid"
disallowed_types = "forbid"
