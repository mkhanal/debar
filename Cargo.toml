[workspace]
resolver = "3"
members = [
    "acceptance",
    "crates/clamav-signatures",
    "crates/compiler",
    "crates/image",
    "crates/interfaces",
    "crates/matching",
    "crates/platform",
    "crates/scan",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
aho-corasick = { version = "=1.1.5", default-features = false, features = ["std", "perf-literal"] }
debar-clamav-signatures = { path = "crates/clamav-signatures" }
debar-image = { path = "crates/image" }
debar-matching = { path = "crates/matching" }
debar-platform = { path = "crates/platform" }
debar-scan = { path = "crates/scan" }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
md-5 = { version = "=0.10.6", default-features = false }
memmap2 = "=0.9.12"
serde_json = "=1.0.154"
sha1 = { version = "=0.10.7", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zerocopy = { version = "=0.8.63", features = ["derive"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
string_slice = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "forbid"
disallowed_types = "forbid"
