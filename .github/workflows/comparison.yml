    permissions:
      contents: read
    uses: mkhanal/debar-clamav-harness/.github/workflows/compare.yml@8d4a5cd881bfa18d8c6cd9822ebfe8fe526c45e6 # main
    with:
      harness-ref: 8d4a5cd881bfa18d8c6cd9822ebfe8fe526c45e6
      known-differences: debar-known-differences-web-pages.jsonl
