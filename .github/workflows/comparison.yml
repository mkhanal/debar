name: Comparison with the reference scanner

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: the harness's fixtures
    permissions:
      contents: read
    uses: mkhanal/debar-clamav-harness/.github/workflows/compare.yml@0cf7156f40565d6617d4027c299e20c807d1503a
    with:
      harness-ref: 0cf7156f40565d6617d4027c299e20c807d1503a
      known-differences: debar-known-differences.jsonl
      build-command: ./in-toolchain cargo build --release --locked --bin debar --bin debar-compiler
      debar-command: >-
        { test -f debar.image || debar/target/release/debar-compiler --databases "$HARNESS_DATABASES"
        --image debar.image --account debar-account.json; }
        && debar/target/release/debar comparison-report --image debar.image
        $( [ "$HARNESS_MATCHING" = every ] && echo --every-match ) $HARNESS_SCAN_OPTIONS
        "$HARNESS_INPUT" "$HARNESS_REPORT"

  built-inputs:
    name: inputs built from every generic extended signature, and across window boundaries
    permissions:
      contents: read
    uses: mkhanal/debar-clamav-harness/.github/workflows/compare.yml@0cf7156f40565d6617d4027c299e20c807d1503a
    with:
      harness-ref: 0cf7156f40565d6617d4027c299e20c807d1503a
      known-differences: debar-known-differences.jsonl
      built-target: "0"
      boundary-sample: "2000"
      build-command: ./in-toolchain cargo build --release --locked --bin debar --bin debar-compiler
