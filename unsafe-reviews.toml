reviewed-on = "2026-11-27"

[[review]]
crate = "block-buffer"
version = "0.12.1"
reached-by = "the product"
unsafe-code = "21 unsafe sites: the eager buffer keeps its cursor in the last byte of a MaybeUninit block (get_pos and set_pos read and write that byte), digest_blocks copies input into the block with copy_nonoverlapping and hands it to compress as initialised once full, digest_pad writes the delimiter and zeros before assume_init_mut, get_data views the initialised prefix with from_raw_parts, Clone is a ptr::read of a type without Drop, two unreachable_unchecked assert the cursor invariant, and the read buffer (for extendable outputs) keeps its cursor in its first byte."
reviewed = "Read every block in lib.rs, sealed.rs and read.rs. The cursor invariant (pos < block size for the eager kind the hashes use, block size below 256 at the type level) is set only by Default, the checked try_new, set and deserialize, and by digest_blocks, which writes in place only when the input is shorter than the space left (so the cursor byte at the end is overwritten only while a full block is compressed, after which ResetGuard rewrites it, also on panic) and otherwise stores a leftover shorter than a block; so get_data never views uninitialised bytes and no copy runs past the block. Input length and content decide only how many whole blocks are passed on, computed as len / N by hybrid-array. The read buffer is not reached by the MD5, SHA-1 and SHA-256 hashers Debar uses. No concern."
reviewed-on = "2026-11-27"

