version = "0.4.15"
reached-by = "the product"
unsafe-code = "About 37 unsafe sites: the sealed unsafe trait ArraySize with its macro-generated impls tying each typenum size to [T; N]; slice views of Array<T, U> through from_raw_parts in as_slice, slice_as_chunks, slice_as_flattened and the core-array casts; reference casts from a slice of checked length (slice_as_array, TryFrom); ptr::read splits, flatten and unflatten behind ManuallyDrop; MaybeUninit arrays in uninit, assume_init, concat and try_from_fn with a drop guard; Send and Sync impls; bytemuck Pod and Zeroable impls (feature off)."
