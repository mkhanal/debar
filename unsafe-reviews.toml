reviewed = "Read the derive logic for the traits Debar derives (from_bytes.rs, into_bytes.rs, unaligned.rs, the Immutable and KnownLayout paths and ImplBlockBuilder in util.rs) and the golden expected outputs for basic structs. Each emitted impl is guarded by where-bounds that make rustc prove every field has the same property, IntoBytes on a non-generic repr(C) struct additionally emits a compile-time PaddingFree check, and Unaligned refuses anything without repr(C), transparent or packed or with align above 1; Debar's records are non-generic repr(C) structs of byteorder integers, so a mistake in a record definition fails to compile rather than emitting an unsound impl. The macro runs on Debar's source only, so hostile scan or image bytes never reach it."
