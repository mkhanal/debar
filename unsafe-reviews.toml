# The unsafe code of every dependency, reviewed at the version Debar uses (Constitution §18).
# `cargo xtask dependencies` fails while a dependency with unsafe code has no review here.

[[review]]
crate = "aho-corasick"
version = "1.1.5"
reached-by = "the product"
unsafe-code = "About 130 non-test unsafe sites: about 115 in the packed Teddy searcher (SSSE3/AVX2/NEON intrinsic wrappers in packed/vector.rs, raw-pointer haystack walks and get_unchecked into buckets and patterns in packed/teddy/generic.rs and builder.rs, raw byte compares in packed/pattern.rs, offset_from in packed/ext.rs), plus 1 sealed unsafe trait Automaton with 5 unsafe impls asserting that state IDs are valid."
reviewed = "Read every unsafe site outside the vector.rs test modules, and the vector.rs wrappers for the x86_64 and aarch64 backends in full. Intrinsics run only after is_x86_feature_detected or compile-time target_feature (NEON is baseline on aarch64); Searcher::find asserts the haystack is at least minimum_len, which makes every pointer walk stay within [start, end); is_prefix_raw checks the pattern length against end; bucket and pattern IDs are fixed when the searcher is built from the patterns, never by the haystack; the Automaton impls rely only on the crate's own construction. No haystack byte can push a pointer out of bounds, and no unsoundness was found. A haystack shorter than the minimum reaches a panicking assert, not UB, and the crate's own callers check the length first."
reviewed-on = "2026-11-27"

[[review]]
crate = "memchr"
version = "2.8.3"
reached-by = "the product"
unsafe-code = "About 330 unsafe sites: about 280 are SIMD intrinsics and raw-pointer haystack walks (generic One/Two/Three and packed-pair searchers, run through SSE2/AVX2, NEON and wasm wrappers), about 40 are the SWAR word-at-a-time fallback, Rabin-Karp and is_equal_raw pointer walks, plus a cached ifunc function pointer transmuted from *mut (), a union of searcher kinds paired with its reader function in memmem, offset_from with unwrap_unchecked in ext.rs, and 2 unsafe impls of Send and Sync for the raw-pointer Iter."
reviewed = "Read in full arch/generic/memchr.rs and packedpair.rs, arch/x86_64/memchr.rs, arch/x86_64/avx2/memchr.rs, arch/all/memchr.rs, rabinkarp.rs and mod.rs, ext.rs and memmem/searcher.rs. Sampled the sse2, neon and packedpair wrappers and found them the same pattern as avx2 (the wasm32 code is not built for Debar's targets). Every vector routine is dispatched only after is_available (runtime CPU detection, or baseline SSE2 or NEON), and every wrapper drops to the byte-at-a-time path when the length is below the vector width, so all loads stay within [start, end) whatever the bytes. Each memmem union read sits in the one function paired with that field at construction. The packed-pair find asserts min_haystack_len, which panics rather than causing UB if misused. No unsoundness or input-dependent invariant was found."
reviewed-on = "2026-11-27"

[[review]]
crate = "regex-automata"
version = "0.4.18"
reached-by = "the product"
unsafe-code = "About 55 unsafe sites: transition-table and haystack get_unchecked in the unrolled dense and lazy DFA search loops (dfa/search.rs, hybrid/search.rs, next_state_unchecked), unsafe from_bytes_unchecked deserialisers with slice::from_raw_parts casts of aligned u32 bytes to StateID, PatternID and accelerators (dfa/dense.rs, sparse.rs, accel.rs, util/wire.rs), the unsafe Automaton trait with 3 impls, and synchronisation primitives (util/lazy.rs, util/pool.rs owner fast path and spin Mutex, 4 unsafe impl Sync)."
reviewed = "Read every unsafe site. The search loops guard each haystack index with at < input.end() (or >= start), where end <= haystack.len(), and index the transition table with state IDs that the DFA itself produced. Those IDs are valid by construction when the DFA is built, and for a deserialised dense DFA they are valid because the checked DFA::from_bytes, which Debar's image crate uses, validates the transitions, start table, match states and accelerators before returning. The from_raw_parts casts check length and alignment first; lazy.rs and pool.rs follow the standard CAS-ownership patterns. Haystack bytes only select a byte class, which is always below the stride, so hostile scanned input cannot break any invariant. The one invariant worth keeping is that compiled DFAs are always loaded through from_bytes and never from_bytes_unchecked, since the image file is the only untrusted path into these tables."
reviewed-on = "2026-11-27"

[[review]]
crate = "zerocopy"
version = "0.8.63"
reached-by = "the product"
unsafe-code = "Pervasive by design: about 300 unsafe blocks, 110 unsafe impls plus about 120 unsafe_impl! macro uses (marker traits FromBytes, IntoBytes, Immutable, Unaligned, KnownLayout on primitives and wrappers), 55 unsafe fns and 29 unsafe traits; the blocks are pointer casts and reference creation justified by layout checks, split_at_unchecked after a validated split point, and unreachable_unchecked on proven-impossible error arms."
reviewed = "A sample, not every block: the paths Debar uses were read in full - FromBytes::ref_from_bytes, ref_from_prefix, ref_from_prefix_with_elems, ref_from_bytes_with_elems, read_from_prefix, IntoBytes::as_bytes, PtrInner::try_cast_into, DstLayout::validate_cast_and_convert_metadata and size_for_metadata (checked, returning Size errors on overflow), and the little_endian U16/U32/U64 types (repr(transparent) over [u8; N], so every byte pattern is valid). Every length, element count and alignment comes from the slice and the caller's count and is checked before a pointer is made, so damaged image bytes can only produce an Err, never an out-of-bounds or invalid reference; further confidence comes from the per-block SAFETY comments enforced by clippy::undocumented_unsafe_blocks and multiple_unsafe_ops_per_block, and the Kani proof harnesses present in layout.rs, byteorder.rs, byte_slice.rs and util/mod.rs (Miri testing is claimed in README.md but its CI config is not in the package). One assumption is Debar's, not zerocopy's: references into a memory map are only sound while the mapped file cannot change or shrink underneath them, which the platform layer's mapping must guarantee."
reviewed-on = "2026-11-27"

