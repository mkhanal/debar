unsafe-code = "About thirty sites: libc FFI for the parallel job runner on Unix (pipe, fcntl, ioctl FIONREAD, poll, and the pidfd_open syscall on Linux; kqueue/kevent only on Apple and BSD), OwnedFd/File from_raw_fd and BorrowedFd::borrow_raw on descriptors just created or taken from the jobserver, Pin::new_unchecked and a no-op RawWaker in a tiny block_on executor, and a home-made OnceLock with unsafe impl Send/Sync; Windows FFI is cfg(windows) and not compiled on Linux."
